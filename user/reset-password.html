<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reset & Change Password – EstateX</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=8.0">
  <style>
    /* Scoped styles for the standalone view */
    .standalone-reset {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-soft, #f8fafc);
      padding: 24px;
    }
    .reset-card {
      background: #ffffff;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      max-width: 480px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    .password-input-group {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.2s ease;
    }
    .password-toggle-btn:hover {
      color: #0f172a;
    }
    .password-toggle-btn svg {
      pointer-events: none;
    }
    /* Explicit Alert Styling (Ensures high visibility) */
    .alert-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 22px;
      transition: all 0.3s ease;
    }
    .alert-banner-danger {
      background-color: #FEF2F2 !important;
      border: 1.5px solid #F87171 !important;
      color: #991B1B !important;
    }
    .alert-banner-success {
      background-color: #ECFDF5 !important;
      border: 1.5px solid #34D399 !important;
      color: #065F46 !important;
    }
    .alert-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }
    .input-error {
      border-color: #EF4444 !important;
      background-color: #FFF5F5 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
    }
    .email-envelope-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .account-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 20px;
      font-size: 0.88rem;
      color: #1e40af;
      margin-bottom: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Dynamic Wrapper: Either dashboard layout (if logged in) or standalone card (if unauthenticated / reset link) -->
  <div id="pageWrapper"></div>

  <script src="../assets/js/app.js"></script>
  <script>
    const API_BASE_URL = window.location.port === '8081' ? '' : 'http://localhost:8081';

    // Helper: Toggle password field visibility using SVG icons
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input || !btn) return;
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      const openIcon = btn.querySelector('.eye-open');
      const closedIcon = btn.querySelector('.eye-closed');
      if (openIcon && closedIcon) {
        openIcon.style.display = isPass ? 'none' : 'block';
        closedIcon.style.display = isPass ? 'block' : 'none';
      }
    }

    // Helper: Clear errors on typing
    function clearInputErrors() {
      document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    }

    function initResetPage() {
      const authUserStr = sessionStorage.getItem('estatex_auth_user');
      const urlParams = new URLSearchParams(window.location.search);
      const tokenParam = (urlParams.get('token') || '').trim();
      const forceForgot = urlParams.get('mode') === 'forgot';
      const wrapper = document.getElementById('pageWrapper');

      if (!wrapper) return;

      const isAuthenticated = authUserStr && !forceForgot && !tokenParam;

      if (isAuthenticated) {
        // SCENARIO 1: AUTHENTICATED USER (RESET / CHANGE PASSWORD FROM DASHBOARD)
        renderAuthenticatedChangePassword(wrapper, authUserStr);
      } else if (tokenParam) {
        // SCENARIO 2: RESET PASSWORD VIA EMAIL LINK (TOKEN PROVIDED)
        renderSetNewPasswordView(wrapper, tokenParam);
      } else {
        // SCENARIO 3: FORGOT PASSWORD (REQUEST RESET LINK)
        renderForgotPasswordRequestView(wrapper);
      }
    }

    // ---------------------------------------------------------------------------
    // SCENARIO 1: Authenticated User Change Password
    // ---------------------------------------------------------------------------
    function renderAuthenticatedChangePassword(wrapper, authUserStr) {
      let authUser;
      try {
        authUser = JSON.parse(authUserStr);
      } catch(e) {
        authUser = { role: 'CUSTOMER', name: 'User', username: 'user@user' };
      }

      const role = (authUser.role || 'CUSTOMER').toUpperCase();
      const userName = authUser.name || authUser.fullName || authUser.username || 'Customer';
      const defaultAvatar = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCcgZmlsbD0nI2NiZDVlMSc+PHBhdGggZD0nTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eicvPjwvc3ZnPg==";
      const avatarSrc = authUser.profilePhotoUrl || authUser.profileImage || defaultAvatar;

      let sidebarHtml = '';
      let breadcrumbText = 'Customer Portal &gt; Account';
      let portalRole = 'Customer Portal';

      if (role === 'ADMIN') {
        breadcrumbText = 'Administrator &gt; Account';
        portalRole = 'Superuser';
        sidebarHtml = `
          <aside class="dashboard-sidebar">
            <div class="sidebar-header">
              <a href="../index.html" class="brand-logo">
                <img src="../assets/images/logo.webp" alt="EstateX Logo">
                <span>EstateX</span>
              </a>
              <span class="role-badge-tag" style="background: rgba(14, 22, 39, 0.4); color: var(--primary-light); border-color: rgba(255,237,216,0.3);">Admin Portal</span>
            </div>
            <nav class="sidebar-nav">
              <div class="sidebar-section-title">Administration</div>
              <a href="../admin/dashboard.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
              </a>
              <a href="../admin/users.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                User Management

              <a href="../admin/agents.html" class="sidebar-item">

              <a href="../admin/properties.html" class="sidebar-item">

                Property Management

              <a href="../admin/bookings.html" class="sidebar-item">

              <a href="../admin/reviews.html" class="sidebar-item">

                Review Management
              </a>
              <div class="sidebar-section-title">System</div>
              <a href="../admin/profile.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Profile
              </a>
              <a href="reset-password.html" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Reset Password
              </a>
            </nav>
            <div class="sidebar-footer">
              <a href="../public/login.html" class="sidebar-item sidebar-item-logout-user">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
              </a>
            </div>
          </aside>
        `;
      } else if (role === 'AGENT') {
        breadcrumbText = 'Agent Portal &gt; Account';
        portalRole = 'Licensed Agent';
        sidebarHtml = `
          <aside class="dashboard-sidebar">
            <div class="sidebar-header">
              <a href="../index.html" class="brand-logo">
                <img src="../assets/images/logo.webp" alt="EstateX Logo">
                <span>EstateX</span>
              </a>
              <span class="role-badge-tag" style="background: rgba(189, 142, 137, 0.2); color: var(--secondary); border-color: var(--secondary);">Agent Portal</span>
            </div>
            <nav class="sidebar-nav">
              <div class="sidebar-section-title">Agent Portal</div>
              <a href="../agent/dashboard.html" class="sidebar-item">

                Dashboard

              <a href="../public/properties.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Property Listings
              </a>
              <a href="../agent/add-property.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Property
              </a>
              <a href="../agent/properties.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Manage Properties
              </a>
              <a href="../agent/inquiries.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Inquiries
              </a>
              <a href="../agent/bookings.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Bookings
              </a>
              <div class="sidebar-section-title">Personal</div>
              <a href="../agent/profile.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profile
              </a>
              <a href="reset-password.html" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Reset Password
              </a>
            </nav>
            <div class="sidebar-footer">
              <a href="../public/login.html" class="sidebar-item sidebar-item-logout-user">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
              </a>
            </div>
          </aside>
        `;
      } else {
        // EXACT sidebar matching user/profile.html
        breadcrumbText = 'Customer Portal &gt; Account';
        portalRole = 'Customer Portal';
        sidebarHtml = `
          <aside class="dashboard-sidebar">
            <div class="sidebar-header">
              <a href="../index.html" class="brand-logo">
                <img src="../assets/images/logo.webp" alt="EstateX Logo">
                <span>EstateX</span>
              </a>
              <span class="role-badge-tag">Customer Portal</span>
            </div>

            <nav class="sidebar-nav">
              <div class="sidebar-section-title">Navigation</div>
              <a href="dashboard.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Dashboard
              </a>
              <a href="../public/properties.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Browse Properties
              </a>
              <a href="bookings.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>

                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                My Bookings
              </a>
              <a href="inquiries.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h4"></path>
                </svg>
                My Inquiries
              </a>
              <a href="reviews.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                  </polygon>
                </svg>
                My Reviews

              <a href="financial-breakdown.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><line x1="7" y1="15" x2="7.01" y2="15"></line><line x1="12" y1="15" x2="12.01" y2="15"></line></svg>
                Financial Breakdown

              <div class="sidebar-section-title">Account Settings</div>
              <a href="profile.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Profile
              </a>
              <a href="reset-password.html" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Reset Password
              </a>
            </nav>

            <div class="sidebar-footer">
              <a href="../public/login.html" class="sidebar-item sidebar-item-logout-user">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
              </a>
              <a href="javascript:void(0)" class="sidebar-item sidebar-item-delete-user"
                data-modal-target="deleteAccountModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>

                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>

      }

      const profileLink = role === 'ADMIN' ? '../admin/profile.html' : role === 'AGENT' ? '../agent/profile.html' : 'profile.html';

      wrapper.innerHTML = `
        <div class="dashboard-layout">
          ${sidebarHtml}

          <div class="dashboard-main">
            <header class="dashboard-topbar">
              <div class="topbar-left">
                <div>
                  <div class="topbar-breadcrumb">${breadcrumbText}</div>

              <div class="topbar-right">

                    <span class="user-meta-name">${userName}</span>
                    <span class="user-meta-role">${portalRole}</span>
                  </div>

              </div>
            </header>

            <main class="dashboard-content">
              <div class="card" id="changePasswordCard" style="max-width: 600px; margin: 0 auto; padding: 32px;">
                <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 24px;">
                  <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(37, 99, 235, 0.1); display: flex; align-items: center; justify-content: center; color: #2563eb; flex-shrink: 0;">

                <form id="changePasswordForm">

                      </button>
                    </div>
                  </div>

                  <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="newPassword" style="font-weight: 600; color: var(--text-primary, #1e293b);">
                      New Password <span style="color: #ef4444;">*</span>
                    </label>
                    <div class="password-input-group">
                      <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (at least 6 characters)" required minlength="6" autocomplete="new-password">
                      <button type="button" class="password-toggle-btn" onclick="togglePass('newPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                      </button>
                    </div>
                    <small style="color: var(--text-muted, #64748b); margin-top: 5px; display: block; font-size: 0.8rem;">Minimum 6 characters long.</small>
                  </div>

                  <div class="form-group" style="margin-bottom: 28px;">
                    <label class="form-label" for="confirmPassword" style="font-weight: 600; color: var(--text-primary, #1e293b);">
                      Confirm New Password <span style="color: #ef4444;">*</span>
                    </label>
                    <div class="password-input-group">
                      <input type="password" id="confirmPassword" class="form-control" placeholder="Re-type your new password" required minlength="6" autocomplete="new-password">
                      <button type="button" class="password-toggle-btn" onclick="togglePass('confirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                      </button>
                    </div>
                  </div>

                  <div style="display: flex; gap: 14px;">
                    <button type="submit" class="btn btn-primary" id="changeBtn" style="min-width: 170px; font-weight: 600; padding: 12px 24px;">
                      Update Password
                    </button>
                    <button type="button" class="btn btn-outline" onclick="window.history.back()" style="padding: 12px 24px;">
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </main>

            <footer class="dashboard-footer">
              <div>&copy; 2026 EstateX Property Portal. All rights reserved.</div>
            </footer>
          </div>
        </div>

        <!-- Delete Account Confirmation Modal -->
        <div class="modal-overlay" id="deleteAccountModal">
          <div class="modal-container">
            <div class="modal-header" style="background: #FEE2E2;">
              <h3 class="modal-title" style="color: var(--delete-dark-red, #991B1B);">Permanently Delete Account?</h3>
              <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <div class="modal-body">
              <p style="font-weight: 600; margin-bottom: 8px;">Are you completely sure?</p>
              <p>This action cannot be undone. All your booked property viewing appointments and personal information will be
                wiped from the EstateX database.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
              <button type="button" class="btn btn-danger" onclick="deleteAccount();">Confirm
                Permanent Deletion</button>
            </div>
          </div>
        </div>
      `;

      // Re-initialize modals and auth bindings for dynamically inserted layout
      if (typeof initModals === 'function') initModals();
      if (typeof initAuth === 'function') initAuth();

      const currentPasswordInput = document.getElementById('currentPassword');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const alertBox = document.getElementById('changeAlert');
      const alertText = document.getElementById('changeAlertText');
      const alertIcon = document.getElementById('changeAlertIcon');
      const btn = document.getElementById('changeBtn');

      [currentPasswordInput, newPasswordInput, confirmPasswordInput].forEach(inp => {
        if (!inp) return;
        inp.addEventListener('input', () => {
          clearInputErrors();
          alertBox.style.display = 'none';
        });
      });

      document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearInputErrors();
        alertBox.style.display = 'none';

        const currentPassword = currentPasswordInput.value.trim();
        const newPassword = newPasswordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        if (newPassword.length < 6) {
          newPasswordInput.classList.add('input-error');
          showChangeAlert("danger", "New password must be at least 6 characters long.");
          return;
        }

        if (newPassword !== confirmPassword) {
          confirmPasswordInput.classList.add('input-error');
          showChangeAlert("danger", "New passwords do not match. Please verify and re-enter.");
          return;
        }

        if (currentPassword === newPassword) {
          newPasswordInput.classList.add('input-error');
          showChangeAlert("danger", "New password must be different from your current password.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Verifying...";

        try {
          const username = authUser.username;
          const res = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(username)}/password`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ currentPassword, newPassword })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            showChangeAlert("success", "Password successfully changed! Your new credentials are now active.");
            document.getElementById('changePasswordForm').reset();
            if (typeof showToast === 'function') {
              showToast("Password updated successfully!", "success");
            }
          } else {
            currentPasswordInput.classList.add('input-error');
            const errorMsg = data.message || "Current password is incorrect. Please check your credentials.";
            showChangeAlert("danger", errorMsg);
            if (typeof showToast === 'function') {
              showToast(errorMsg, "danger");
            }
          }
        } catch (err) {
          showChangeAlert("danger", "Unable to connect to backend server. Please verify port 8081 is active.");
        } finally {
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      });

      function showChangeAlert(type, message) {
        alertBox.className = 'alert-banner ' + (type === 'danger' ? 'alert-banner-danger' : 'alert-banner-success');
        alertIcon.innerHTML = type === 'danger'
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        alertText.innerHTML = message;
        alertBox.style.display = 'flex';
      }

      const logoutBtn = document.querySelector('.sidebar-item-logout-user');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          sessionStorage.clear();
          window.location.href = '../public/login.html';
        });
      }
    }

    // ---------------------------------------------------------------------------
    // SCENARIO 2: Set New Password via Email Reset Token
    // ---------------------------------------------------------------------------
    function renderSetNewPasswordView(wrapper, token) {
      let resolvedUsername = '';

      wrapper.innerHTML = `
        <div class="standalone-reset">
          <div class="reset-card" id="setNewPasswordCard">
            <div style="text-align: center; margin-bottom: 24px;">
              <a href="../public/login.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #0f172a; font-weight: 700; font-size: 1.5rem; justify-content: center;">
                <img src="../assets/images/logo.webp" alt="EstateX Logo" style="height: 32px;">
                EstateX
              </a>
            </div>

            <h2 style="text-align: center; margin-bottom: 6px; font-size: 1.45rem; font-weight: 700; color: #0f172a;">Set New Password</h2>
            <p style="text-align: center; color: #64748b; margin-bottom: 20px; font-size: 0.9rem;">
              Please enter your new password to restore account access.
            </p>

            <!-- Verification Status Badge -->
            <div id="accountBadgeContainer" style="text-align: center; margin-bottom: 16px;">
              <span class="account-badge" id="accountBadgeText">
                <span style="display:inline-block; animation: spin 1s infinite linear;">⏳</span> Verifying reset token...
              </span>
            </div>

            <div id="resetAlert" class="alert-banner" style="display: none;">
              <div class="alert-icon" id="resetAlertIcon"></div>
              <div id="resetAlertText"></div>
            </div>

            <div id="invalidTokenAction" style="display: none; margin-bottom: 20px;">
              <a href="reset-password.html?mode=forgot" class="btn btn-primary" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600; padding: 12px;">
                Request New Password Reset Link
              </a>
            </div>

            <form id="setNewPasswordForm">
              <input type="hidden" id="resetTokenInput" value="${token}">

              <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="resetNewPassword" style="font-weight: 600; color: #1e293b;">
                  New Password <span style="color: #ef4444;">*</span>
                </label>
                <div class="password-input-group">
                  <input type="password" id="resetNewPassword" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                  <button type="button" class="password-toggle-btn" onclick="togglePass('resetNewPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                    <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
                <small style="color: #64748b; margin-top: 5px; display: block; font-size: 0.8rem;">Minimum 6 characters long.</small>
              </div>

              <div class="form-group" style="margin-bottom: 26px;">
                <label class="form-label" for="resetConfirmPassword" style="font-weight: 600; color: #1e293b;">
                  Confirm New Password <span style="color: #ef4444;">*</span>
                </label>
                <div class="password-input-group">
                  <input type="password" id="resetConfirmPassword" class="form-control" placeholder="Re-enter your new password" required minlength="6" autocomplete="new-password">
                  <button type="button" class="password-toggle-btn" onclick="togglePass('resetConfirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                    <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600; padding: 12px;" id="savePasswordBtn">
                Reset & Save Password
              </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
              <a href="../public/login.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">&larr; Back to Sign In</a>
            </div>
          </div>
        </div>
      `;

      const resetNewPass = document.getElementById('resetNewPassword');
      const resetConfirmPass = document.getElementById('resetConfirmPassword');
      const resetAlert = document.getElementById('resetAlert');
      const resetAlertText = document.getElementById('resetAlertText');
      const resetAlertIcon = document.getElementById('resetAlertIcon');
      const saveBtn = document.getElementById('savePasswordBtn');
      const accountBadgeContainer = document.getElementById('accountBadgeContainer');
      const accountBadgeText = document.getElementById('accountBadgeText');
      const invalidTokenAction = document.getElementById('invalidTokenAction');
      const formEl = document.getElementById('setNewPasswordForm');

      [resetNewPass, resetConfirmPass].forEach(i => {
        if (!i) return;
        i.addEventListener('input', () => {
          clearInputErrors();
          resetAlert.style.display = 'none';
        });
      });

      // Automatically verify token against backend on page load
      verifyTokenOnLoad(token);

      async function verifyTokenOnLoad(tok) {
        try {
          const res = await fetch(`${API_BASE_URL}/api/auth/verify-reset-token?token=${encodeURIComponent(tok)}`);
          const data = await res.json().catch(() => ({}));

          if (res.ok && data.valid) {
            accountBadgeContainer.style.display = 'block';
            resolvedUsername = data.username || '';
            const userLabel = resolvedUsername ? `<strong>${resolvedUsername}</strong> (${data.email})` : `<strong>${data.email || 'Verified Account'}</strong>`;
            accountBadgeText.innerHTML = `🛡️ Resetting password for: ${userLabel}`;
          } else {
            accountBadgeContainer.style.display = 'none';
            formEl.style.display = 'none';
            invalidTokenAction.style.display = 'block';
            showResetAlert('danger', data.message || "This password reset link is invalid or has expired. Please request a new link.");
          }
        } catch (err) {
          accountBadgeText.innerHTML = `🔑 Token: <strong>${tok}</strong>`;
        }
      }

      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearInputErrors();
        const newPassword = resetNewPass.value.trim();
        const confirmPassword = resetConfirmPass.value.trim();

        if (newPassword.length < 6) {
          resetNewPass.classList.add('input-error');
          showResetAlert('danger', "Password must be at least 6 characters long.");
          return;
        }

        if (newPassword !== confirmPassword) {
          resetConfirmPass.classList.add('input-error');
          showResetAlert('danger', "Passwords do not match. Please verify.");
          return;
        }

        resetAlert.style.display = 'none';
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving new password...';

        try {
          const res = await fetch(`${API_BASE_URL}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            accountBadgeContainer.style.display = 'none';
            formEl.style.display = 'none';
            const userTarget = data.username || resolvedUsername || '';
            const userMsg = userTarget ? ` for <strong>${userTarget}</strong>` : '';
            showResetAlert('success', `<strong>Password Reset Successful!</strong><br>Your new password is now active${userMsg}. Redirecting to Sign In in 2 seconds...`);

            setTimeout(() => {
              const redirectUrl = userTarget ? `../public/login.html?username=${encodeURIComponent(userTarget)}` : '../public/login.html';
              window.location.href = redirectUrl;
            }, 2000);
          } else {
            showResetAlert('danger', data.message || "Password reset token is invalid or expired. Please request a new link.");
          }
        } catch (err) {
          showResetAlert('danger', "Server connection error. Please ensure your backend is running.");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Reset & Save Password';
        }
      });

      function showResetAlert(type, msg) {
        resetAlert.className = 'alert-banner ' + (type === 'danger' ? 'alert-banner-danger' : 'alert-banner-success');
        resetAlertIcon.innerHTML = type === 'danger'
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        resetAlertText.innerHTML = msg;
        resetAlert.style.display = 'flex';
      }
    }

    // ---------------------------------------------------------------------------
    // SCENARIO 3: Forgot Password Request View
    // ---------------------------------------------------------------------------
    function renderForgotPasswordRequestView(wrapper) {
      wrapper.innerHTML = `
        <div class="standalone-reset">
          <div class="reset-card">
            <div style="text-align: center; margin-bottom: 24px;">
              <a href="../public/login.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #0f172a; font-weight: 700; font-size: 1.5rem; justify-content: center;">
                <img src="../assets/images/logo.webp" alt="EstateX Logo" style="height: 32px;">
                EstateX
              </a>
            </div>

            <div id="forgotInputView">
              <h2 style="text-align: center; margin-bottom: 6px; font-size: 1.45rem; font-weight: 700; color: #0f172a;">Forgot Password</h2>
              <p style="text-align: center; color: #64748b; margin-bottom: 24px; font-size: 0.9rem;">
                Enter your registered email address or username and we will send you a secure link to reset your password.
              </p>

              <div id="forgotAlert" class="alert-banner alert-banner-danger" style="display: none;">
                <div class="alert-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                </div>
                <div id="forgotAlertText"></div>
              </div>

              <form id="forgotPasswordForm">
                <div class="form-group" style="margin-bottom: 22px;">
                  <label class="form-label" for="resetEmail" style="font-weight: 600; color: #1e293b;">
                    Email Address or Username <span style="color: #ef4444;">*</span>
                  </label>
                  <input type="text" id="resetEmail" class="form-control" required placeholder="e.g. name@user or your email address" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; font-weight: 600; padding: 12px;" id="sendResetBtn">
                  Send Reset Link
                </button>
              </form>
            </div>

            <!-- Confirmation View: No bypass button, user MUST click link in email -->
            <div id="forgotSuccessView" style="display: none; text-align: center;">
              <div class="email-envelope-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <h3 style="font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 8px;">Check Your Email</h3>
              <p style="color: #64748b; font-size: 0.92rem; line-height: 1.5; margin-bottom: 20px;">
                We have sent a secure password reset link to <strong id="sentEmailTarget" style="color: #0f172a;"></strong>. Please check your inbox and click the link in the email to set your new password.
              </p>

              <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; text-align: left; font-size: 0.85rem; color: #475569; line-height: 1.5;">
                <div style="display:flex; align-items:center; gap:8px; font-weight:600; color:#0f172a; margin-bottom:4px;">
                  <span>ℹ️</span> Reset Instructions
                </div>
                <div>• The reset link is valid for <strong>30 minutes</strong>.</div>
                <div>• Click the link in the email to open the password reset page and set your new password.</div>
              </div>

              <p style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 0;">
                Didn't receive the email? Check your spam folder or verify your email address.
              </p>
            </div>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
              <a href="../public/login.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">&larr; Back to Sign In</a>
            </div>
          </div>
        </div>
      `;

      const emailInput = document.getElementById('resetEmail');
      const alertBox = document.getElementById('forgotAlert');
      const alertText = document.getElementById('forgotAlertText');
      const inputView = document.getElementById('forgotInputView');
      const successView = document.getElementById('forgotSuccessView');
      const sentEmailTarget = document.getElementById('sentEmailTarget');
      const btn = document.getElementById('sendResetBtn');

      emailInput.addEventListener('input', () => {
        alertBox.style.display = 'none';
        emailInput.classList.remove('input-error');
      });

      document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        emailInput.classList.remove('input-error');

        const val = emailInput.value.trim();
        if (!val) return;

        btn.disabled = true;
        btn.innerHTML = `<span style="display:inline-block; animation: spin 1s infinite linear;">⏳</span> Sending link...`;

        try {
          const res = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: val, baseUrl: window.location.origin })
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.success) {
            inputView.style.display = 'none';
            sentEmailTarget.textContent = data.email || val;
            successView.style.display = 'block';
          } else {
            emailInput.classList.add('input-error');
            alertText.textContent = data.message || "No registered account found with that email or username.";
            alertBox.style.display = 'flex';
          }
        } catch (err) {
          alertText.textContent = "Unable to connect to the backend server. Please verify port 8081 is active.";
          alertBox.style.display = 'flex';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      });
    }

    // Initialize reliably regardless of when script is loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initResetPage);
    } else {
      initResetPage();
    }
  </script>
</body>
</html>
